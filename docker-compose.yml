services:
  vpsfree:
    build:
      context: .
      dockerfile: Dockerfile
    image: vpsfree:latest
    container_name: vpsfree
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
    environment:
      - VPS_PASSWORD=${VPS_PASSWORD:-vpsfree12345}
      - TAILSCALE_AUTH_KEY=${TAILSCALE_AUTH_KEY:-}
      - VPS_USER=${VPS_USER:-vps}
      - HOSTNAME=${HOSTNAME:-vpsfree-docker}
      - TAILSCALE_EXTRA_ARGS=${TAILSCALE_EXTRA_ARGS:-}
    # Opsional: Jika ingin membuka port 22 ke host lokal
    # ports:
    #   - "2222:22"

volumes:
  tailscale-state:
